<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture recorder (dev only)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        background: #111;
        color: #eee;
        max-width: 40rem;
      }
      label {
        display: block;
        margin: 0.4rem 0;
      }
      select,
      button {
        font-size: 1rem;
        min-height: 2.75rem;
        padding: 0 0.8rem;
      }
      #view {
        position: relative;
        width: 100%;
      }
      #view.mirror video,
      #view.mirror canvas {
        transform: scaleX(-1);
      }
      video {
        width: 100%;
        display: block;
        background: #000;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #scramble {
        font-family: monospace;
        font-size: 1.3rem;
        margin: 0.5rem 0;
      }
      .rec {
        background: #b91c1c;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Fixture recorder</h1>
    <p>Dev only. Records a test clip and saves it to this device. Nothing is uploaded.</p>
    <ol>
      <li>Start with a solved cube: white on top, green facing you.</li>
      <li>Do the scramble below.</li>
      <li>Press Record, do a normal grip-and-spin scan, then press Stop.</li>
    </ol>
    <p id="scramble">(press New scramble)</p>
    <button id="new">New scramble</button>
    <label
      >Cube
      <select id="cube"></select
    ></label>
    <label
      >Lighting
      <select id="lighting"></select
    ></label>
    <label
      >Picture flipped left to right?
      <select id="flipped">
        <option value="false">No</option>
        <option value="true">Yes</option>
      </select>
    </label>
    <label
      >Stickers marked with dots?
      <select id="marked">
        <option value="false">No</option>
        <option value="true">Yes</option>
      </select>
    </label>
    <label><input type="checkbox" id="mirror" checked /> Show the picture like a mirror</label>
    <p>
      <button id="camera">Turn on the camera</button>
      <button id="record" class="rec" disabled>Record</button>
    </p>
    <div id="view" class="mirror">
      <video id="video" playsinline muted></video><canvas id="overlay"></canvas>
    </div>
    <p id="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
